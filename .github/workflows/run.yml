name: 刷步数

on:
  schedule:
    - cron: '19 0,2,6,7,8,14 * * *'
    - cron: '10 16 * * *'  # 北京时间 00:10
    - cron: '10 18 * * *'  # 北京时间 02:10
    - cron: '10 20 * * *'  # 北京时间 04:10
    - cron: '10 0 * * *'   # 北京时间 08:10
    - cron: '10 4 * * *'   # 北京时间 12:10
    - cron: '30 5 * * *'   # 北京时间 13:30
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
      - name: 发送微信通知（Server酱）
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send'
          method: 'POST'
          contentType: 'application/x-www-form-urlencoded'
          data: |
            title=GitHub Action定时执行结果
            desp=仓库：${{ github.repository }}
            状态：${{ job.status }}
            时间：${{ github.event.head_commit.timestamp }}
            链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
